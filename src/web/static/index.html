<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Speaking Coach - Live Audio</title>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-secondary: #071426;
      --bg-card: #081d36;
      --accent: #00e5ff;
      --accent-hover: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #00e5ff;
      --danger: #ef4444;
      --warning: #f59e0b;
      --coach-bubble: rgba(15, 23, 42, 0.85);
      --student-bubble: rgba(0, 229, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(
        135deg,
        #020617 0%,
        #071426 40%,
        #081d36 70%,
        #020617 100%
      );
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding-bottom: 4px;
    }

    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .robot-avatar {
      width: 70px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.5));
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .status-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(0, 229, 255, 0.2);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-dot.connecting {
      background-color: var(--warning);
      animation: pulse 1.2s infinite;
    }

    .status-dot.speaking {
      background-color: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-start {
      background-color: #00e5ff;
      color: #020617;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }

    .btn-start:hover:not(:disabled) {
      background-color: #38bdf8;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.7);
      transform: translateY(-1px);
    }

    .btn-stop {
      background-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .btn-stop:hover:not(:disabled) {
      background-color: #dc2626;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .history-card {
      background: rgba(15, 23, 42, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 75vh;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .history-header {
      padding: 14px 20px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
      font-size: 0.85rem;
      font-weight: 600;
      color: #00e5ff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .history-messages {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 16px 20px;
      border-radius: 24px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .bubble-student {
      align-self: flex-end;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-bottom-right-radius: 4px;
      color: #f8fafc;
    }

    .bubble-coach {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-bottom-left-radius: 4px;
      color: #f8fafc;
    }

    .bubble-role {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .bubble-student .bubble-role { color: #00e5ff; }
    .bubble-coach .bubble-role { color: #38bdf8; }

    #thinking {
      color: #00e5ff;
      font-size: 1.1rem;
      letter-spacing: 6px;
      animation: pulse 1s infinite;
      text-shadow: 0 0 10px #00e5ff;
    }

    footer {
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="hero">
        <img
          src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
          class="robot-avatar"
          alt="Robot Coach"
        >
        <h1>English Speaking Coach</h1>
      </div>
    </header>

    <!-- Barra de Status e Controle Único -->
    <div class="status-card">
      <div class="status-indicator">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Desconectado. Clique em START para praticar.</span>
      </div>
      <div class="controls">
        <button id="sessionBtn" class="btn-start">
          ▶ START
        </button>
      </div>
    </div>

    <!-- Banner de Alerta / Erros -->
    <div id="alertBox" class="alert alert-error"></div>

    <!-- Histórico de Conversação Sci-Fi -->
    <div class="history-card">
      <div class="history-header">Histórico da Conversa</div>
      <div id="historyMessages" class="history-messages"></div>
      <div id="thinking" style="display:none; text-align:center; padding:10px;">
        ● ● ●
      </div>
    </div>

    <!-- Footer MHMF Technologies -->
    <footer>
      <div style="
        font-size:18px;
        font-weight:700;
        color:#00e5ff;
        letter-spacing:2px;
        text-transform:uppercase;
        text-shadow:
        0 0 10px #00e5ff,
        0 0 20px #00e5ff;">
        Developed by MHMF Technologies
      </div>
    </footer>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Variáveis Globais de Estado
    // ---------------------------------------------------------------------------
    let websocket = null;
    let inputAudioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let audioWorkletNode = null;

    let playbackAudioCtx = null;
    let nextPlayTime = 0;
    let activeAudioSources = [];

    let currentStudentTurn = '';
    let currentCoachTurn = '';
    let isRunning = false;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const sessionBtn = document.getElementById('sessionBtn');
    const alertBox = document.getElementById('alertBox');
    const historyMessages = document.getElementById('historyMessages');
    const thinkingEl = document.getElementById('thinking');

    sessionBtn.addEventListener('click', () => {
      if (!isRunning) {
        startPractice();
      } else {
        stopPractice();
      }
    });

    function showAlert(message) {
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    function setStatus(state, message) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = message;
    }

    // ---------------------------------------------------------------------------
    // Gerenciamento de Reprodução de Áudio (PCM 24 kHz)
    // ---------------------------------------------------------------------------
    function initPlaybackAudio() {
      if (!playbackAudioCtx || playbackAudioCtx.state === 'closed') {
        playbackAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        nextPlayTime = playbackAudioCtx.currentTime;
      }
      if (playbackAudioCtx.state === 'suspended') {
        playbackAudioCtx.resume();
      }
    }

    function playAudioChunk(arrayBuffer) {
      initPlaybackAudio();

      const int16 = new Int16Array(arrayBuffer);
      if (int16.length === 0) return;

      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      const audioBuffer = playbackAudioCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      const source = playbackAudioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(playbackAudioCtx.destination);

      const now = playbackAudioCtx.currentTime;
      if (nextPlayTime < now) {
        nextPlayTime = now + 0.04;
      }

      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
      activeAudioSources.push(source);

      source.onended = () => {
        const idx = activeAudioSources.indexOf(source);
        if (idx !== -1) activeAudioSources.splice(idx, 1);
      };
    }

    function stopAllAudioPlayback() {
      for (const src of activeAudioSources) {
        try { src.stop(); } catch (e) {}
      }
      activeAudioSources = [];
      if (playbackAudioCtx) {
        nextPlayTime = playbackAudioCtx.currentTime;
      }
    }

    // ---------------------------------------------------------------------------
    // Conversão e Downsampling de Áudio (Entrada para PCM 16 kHz 16-bit)
    // ---------------------------------------------------------------------------
    function downsampleTo16k(inputData, inputSampleRate) {
      if (inputSampleRate === 16000) return inputData;
      const ratio = inputSampleRate / 16000;
      const newLength = Math.round(inputData.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;

      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < inputData.length; i++) {
          accum += inputData[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return buffer;
    }

    // ---------------------------------------------------------------------------
    // Captura de Microfone com AudioWorklet
    // ---------------------------------------------------------------------------
    async function startMicrophone() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        }
      });

      inputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (inputAudioCtx.state === 'suspended') {
        await inputAudioCtx.resume();
      }

      const workletCode = `
        class AudioRecorderProcessor extends AudioWorkletProcessor {
          process(inputs) {
            const input = inputs[0];
            if (input && input.length > 0) {
              const channelData = input[0];
              this.port.postMessage(channelData);
            }
            return true;
          }
        }
        registerProcessor('audio-recorder-processor', AudioRecorderProcessor);
      `;

      const workletBlob = new Blob([workletCode], { type: 'application/javascript' });
      const workletUrl = URL.createObjectURL(workletBlob);
      await inputAudioCtx.audioWorklet.addModule(workletUrl);
      URL.revokeObjectURL(workletUrl);

      micSourceNode = inputAudioCtx.createMediaStreamSource(micStream);
      audioWorkletNode = new AudioWorkletNode(inputAudioCtx, 'audio-recorder-processor');

      let micAccumulator = [];
      const MIC_CHUNK_SAMPLES = 1600; // ~100ms de áudio a 16kHz

      audioWorkletNode.port.onmessage = (event) => {
        const floatData = event.data;
        if (!websocket || websocket.readyState !== WebSocket.OPEN) return;

        const downsampled = downsampleTo16k(floatData, inputAudioCtx.sampleRate);
        for (let i = 0; i < downsampled.length; i++) {
          micAccumulator.push(downsampled[i]);
        }

        if (micAccumulator.length >= MIC_CHUNK_SAMPLES) {
          const chunkToSend = new Float32Array(micAccumulator);
          micAccumulator = [];
          const pcm16Buffer = floatTo16BitPCM(chunkToSend);
          websocket.send(pcm16Buffer);
        }
      };

      micSourceNode.connect(audioWorkletNode);
    }

    function stopMicrophone() {
      if (audioWorkletNode) {
        audioWorkletNode.disconnect();
        audioWorkletNode = null;
      }
      if (micSourceNode) {
        micSourceNode.disconnect();
        micSourceNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      if (inputAudioCtx && inputAudioCtx.state !== 'closed') {
        inputAudioCtx.close();
        inputAudioCtx = null;
      }
    }

    // ---------------------------------------------------------------------------
    // Interface e Histórico de Conversação (ME e COACH)
    // ---------------------------------------------------------------------------
    function appendChatBubble(role, text) {
      if (!text || !text.trim()) return;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble bubble-${role}`;

      const roleLabel = document.createElement('div');
      roleLabel.className = 'bubble-role';
      roleLabel.textContent = role === 'student' ? 'ME' : 'COACH';

      const content = document.createElement('div');
      content.textContent = text.trim();

      bubble.appendChild(roleLabel);
      bubble.appendChild(content);
      historyMessages.appendChild(bubble);
      historyMessages.scrollTop = historyMessages.scrollHeight;
    }

    // ---------------------------------------------------------------------------
    // Controle de Sessão Único (START / STOP)
    // ---------------------------------------------------------------------------
    async function startPractice() {
      hideAlert();
      isRunning = true;
      sessionBtn.innerHTML = '■ STOP';
      sessionBtn.className = 'btn-stop';
      setStatus('connecting', 'Conectando ao servidor...');

      try {
        initPlaybackAudio();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        websocket = new WebSocket(wsUrl);
        websocket.binaryType = 'arraybuffer';

        websocket.onopen = async () => {
          setStatus('connecting', 'Iniciando microfone e sessão Gemini Live...');
          try {
            await startMicrophone();
            setStatus('connected', 'Conectado! Pode falar em inglês.');
          } catch (micErr) {
            showAlert('Erro ao acessar o microfone: ' + micErr.message);
            stopPractice();
          }
        };

        websocket.onmessage = (event) => {
          // 1. Áudio PCM 24kHz do Coach
          if (event.data instanceof ArrayBuffer) {
            setStatus('speaking', 'Coach falando...');
            if (thinkingEl) thinkingEl.style.display = 'none';
            playAudioChunk(event.data);
            return;
          }

          // 2. Mensagens JSON de texto
          try {
            const data = JSON.parse(event.data);

            if (data.type === 'session_ready') {
              setStatus('connected', 'Sessão pronta. Pode falar em inglês!');
            }
            else if (data.type === 'interrupted') {
              stopAllAudioPlayback();
              if (thinkingEl) thinkingEl.style.display = 'none';
              setStatus('connected', 'Você interrompeu o Coach. Ouvindo você...');
            }
            else if (data.type === 'student_transcript') {
              currentStudentTurn += data.text;
              if (thinkingEl) thinkingEl.style.display = 'block';
            }
            else if (data.type === 'coach_transcript') {
              currentCoachTurn += data.text;
              if (thinkingEl) thinkingEl.style.display = 'none';
            }
            else if (data.type === 'turn_complete') {
              if (thinkingEl) thinkingEl.style.display = 'none';
              if (currentStudentTurn.trim()) {
                appendChatBubble('student', currentStudentTurn);
              }
              if (currentCoachTurn.trim()) {
                appendChatBubble('coach', currentCoachTurn);
              }

              currentStudentTurn = '';
              currentCoachTurn = '';
              setStatus('connected', 'Conectado! Pode falar em inglês.');
            }
            else if (data.type === 'error') {
              if (thinkingEl) thinkingEl.style.display = 'none';
              showAlert(data.message);
              setStatus('', 'Erro na sessão.');
              stopPractice();
            }
            else if (data.type === 'session_ended') {
              if (thinkingEl) thinkingEl.style.display = 'none';
              setStatus('', 'Sessão finalizada com sucesso.');
            }
          } catch (parseErr) {
            console.error('Erro ao processar mensagem JSON:', parseErr);
          }
        };

        websocket.onerror = (err) => {
          console.error('Erro no WebSocket:', err);
          showAlert('Erro na conexão WebSocket com o servidor.');
          stopPractice();
        };

        websocket.onclose = () => {
          stopMicrophone();
          stopAllAudioPlayback();
          if (thinkingEl) thinkingEl.style.display = 'none';
          isRunning = false;
          sessionBtn.innerHTML = '▶ START';
          sessionBtn.className = 'btn-start';
          setStatus('', 'Desconectado.');
        };

      } catch (err) {
        console.error(err);
        showAlert('Erro ao iniciar prática: ' + err.message);
        isRunning = false;
        sessionBtn.innerHTML = '▶ START';
        sessionBtn.className = 'btn-start';
        setStatus('', 'Desconectado.');
      }
    }

    function stopPractice() {
      isRunning = false;
      sessionBtn.innerHTML = '▶ START';
      sessionBtn.className = 'btn-start';
      setStatus('connecting', 'Finalizando sessão...');

      if (thinkingEl) thinkingEl.style.display = 'none';

      if (websocket && websocket.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({ action: 'stop' }));
        setTimeout(() => {
          if (websocket) websocket.close();
        }, 500);
      } else {
        if (websocket) websocket.close();
      }

      stopMicrophone();
      stopAllAudioPlayback();

      if (currentStudentTurn.trim()) {
        appendChatBubble('student', currentStudentTurn);
        currentStudentTurn = '';
      }
      if (currentCoachTurn.trim()) {
        appendChatBubble('coach', currentCoachTurn);
        currentCoachTurn = '';
      }

      setStatus('', 'Sessão encerrada e salva.');
    }
  </script>
</body>
</html>
